<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>LES NRG — Beta Test</title>
  <style>
    @font-face {
      font-family: 'Peddana';
      src: url('/fonts/peddana-regular.ttf');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    body {
      touch-action: none;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100dvh;
      font-family: monospace;
      overflow: auto;
    }
    #game-wrap {
      position: relative;
      /* scale to fill the display width while fitting in viewport height */
      width: min(100vw, calc((100dvh - 64px) * 800 / 1080));
      margin: 0 auto;
    }
    #game-col { display: flex; flex-direction: column; }
    #game {
      display: block;
      width: 100%;
      aspect-ratio: 800 / 1080;
      height: auto;
      border: 2px solid #F5C500;
    }
    #controls {
      color: #ffffff33;
      font-size: 12px;
      margin-top: 10px;
      letter-spacing: 0.08em;
      text-align: center;
    }
    /* ── Mobile touch controls ── */
    #mobile-controls {
      display: none; /* hidden on desktop */
    }
    @media (hover: none) and (pointer: coarse) {
      #mobile-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 14px;
        width: 100%;
        pointer-events: none;
        background: #0a0a0a;
      }
    }
    .dpad { display: flex; gap: 10px; pointer-events: none; }
    .ctrl-btn {
      pointer-events: all;
      width: 72px;
      height: 72px;
      background: rgba(245, 197, 0, 0.09);
      border: 2px solid rgba(245, 197, 0, 0.28);
      border-radius: 50%;
      color: rgba(245, 197, 0, 0.5);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.08s;
    }
    .ctrl-btn:active { background: rgba(245, 197, 0, 0.35); }
    #btn-jump { width: 84px; height: 84px; font-size: 13px; font-weight: bold; letter-spacing: 0.05em; }
    /* ── Score bar ── */
    #score-bar {
      width: 100%;
      height: 60px;
      background: #060e0a;
      border: 2px solid #1a3a28;
      border-bottom: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      font-family: monospace;
      flex-shrink: 0;
    }
    #sb-lives { font-size: 24px; min-width: 110px; letter-spacing: 4px; }
    #sb-timer { font-size: 28px; font-weight: bold; color: rgba(255,255,255,0.9); text-align: center; }
    #sb-cfm { display: flex; flex-direction: column; align-items: flex-end; min-width: 150px; }
    #sb-cfm-row { display: flex; align-items: baseline; gap: 0; }
    #sb-cfm-label { font-size: 30px; font-weight: bold; color: rgba(0,200,100,0.55); line-height: 1; }
    #sb-cfm-value { font-size: 30px; font-weight: bold; line-height: 1; }
    #sb-cfm-track { width: 130px; height: 7px; background: #0d1f15; border-radius: 3px; margin-top: 4px; }
    #sb-cfm-fill { height: 100%; border-radius: 3px; width: 100%; }
  </style>
</head>
<body>
<div id="game-wrap">
    <div id="game-col">
      <div id="score-bar">
        <div id="sb-lives">♥ ♥ ♥</div>
        <div id="sb-timer">1:00</div>
        <div id="sb-cfm">
          <div id="sb-cfm-row">
            <span id="sb-cfm-value">5,000</span><span id="sb-cfm-label"> CFM@50pa</span>
          </div>
          <div id="sb-cfm-track"><div id="sb-cfm-fill"></div></div>
        </div>
      </div>
      <canvas id="game" width="600" height="810"></canvas>
    </div>
  </div>
  <div id="mobile-controls">
    <div class="dpad">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <button class="ctrl-btn" id="btn-jump">JUMP</button>
  </div>
  <div id="controls">ARROW KEYS / WASD &nbsp;|&nbsp; SPACE to jump &nbsp;|&nbsp; F to shoot</div>

  <script>
    const canvas = document.getElementById('game');
    let ctx      = canvas.getContext('2d', { alpha: false });
    // ─── Reduced-res rendering: canvas is 600×810, scale 0.75 so code uses 800×1080 coords ──
    const RENDER_SCALE = 0.75;
    ctx.scale(RENDER_SCALE, RENDER_SCALE);
    canvas.style.imageRendering = 'auto';

    // ─── Fast sin lookup (1024-entry, avoids Math.sin in hot loops) ──────────
    const SIN_N = 1024;
    const SIN_K = SIN_N / (2 * Math.PI);
    const SIN_TABLE = new Float32Array(SIN_N);
    for (let i = 0; i < SIN_N; i++) SIN_TABLE[i] = Math.sin(2 * Math.PI * i / SIN_N);
    function fsin(x) {
      return SIN_TABLE[((x * SIN_K % SIN_N) + SIN_N) % SIN_N | 0];
    }

    function fillCircle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    function fillEllipse(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill(); }

// ─── Logo blade image (real SVG path from navbar) ─────────────────────────
    const imgBlades = new Image();
    imgBlades.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.511 8.511 82.977 82.977">' +
      '<path d="M65.663 31.972c-0.431 1.082-2.916 6.376-6.887 11.376-1.854 2.335-4.236 4.094-6.037 5.222-0.153-0.331-0.353-0.628-0.596-0.891 1.85-2.367 4.409-6.216 5.24-10.302 1.82-6.495-0.103-12.741-0.895-14.089-1.195-3.259-4.372-4.667-6.383-3.377-2.025 1.29-2.585 4.068-1.761 6.367 0.461 1.07 2.446 6.569 3.174 12.911 0.325 2.829-0.061 5.623-0.511 7.672-0.359-0.157-0.752-0.245-1.162-0.269-0.392-2.977-1.319-7.293-3.531-10.638-3.309-5.88-9.083-8.934-10.596-9.329-3.152-1.456-6.393-0.209-6.901 2.126-0.52 2.344 1.048 4.703 3.256 5.746 1.084 0.43 6.376 2.917 11.377 6.886 2.093 1.662 3.72 3.746 4.847 5.457-0.41 0.174-0.78 0.427-1.09 0.737-2.387-1.794-5.96-4.032-9.728-4.799-6.498-1.82-12.74 0.1-14.089 0.894-3.26 1.196-4.667 4.371-3.377 6.383 1.289 2.026 4.066 2.585 6.365 1.762 1.071-0.461 6.57-2.447 12.914-3.177 2.56-0.292 5.09-0.003 7.069 0.389-0.092 0.309-0.157 0.628-0.157 0.967 0 0.131 0.025 0.253 0.039 0.378-2.95 0.425-7.011 1.373-10.186 3.471-5.881 3.309-8.937 9.08-9.329 10.598-1.459 3.149-0.208 6.393 2.126 6.901 2.343 0.52 4.703-1.048 5.745-3.258 0.431-1.081 2.916-6.376 6.887-11.376 1.62-2.04 3.644-3.641 5.331-4.764 0.25 0.36 0.567 0.67 0.935 0.912-1.808 2.387-4.095 6.001-4.874 9.822-1.82 6.495 0.103 12.74 0.898 14.083 1.195 3.263 4.37 4.672 6.381 3.382 2.026-1.292 2.585-4.069 1.759-6.367-0.46-1.07-2.446-6.57-3.174-12.913-0.314-2.74 0.039-5.453 0.47-7.485 0.139 0.019 0.275 0.042 0.42 0.042 0.264 0 0.52-0.033 0.767-0.092 0.382 2.979 1.303 7.376 3.551 10.77 3.307 5.881 9.08 8.936 10.593 9.327 3.152 1.462 6.392 0.211 6.904-2.126 0.517-2.343-1.051-4.7-3.26-5.745-1.081-0.428-6.374-2.916-11.375-6.886-2.289-1.818-4.02-4.14-5.151-5.927 0.289-0.213 0.543-0.467 0.752-0.759 2.36 1.854 6.247 4.453 10.368 5.292 6.498 1.82 12.741-0.1 14.089-0.895 3.259-1.195 4.668-4.372 3.378-6.384-1.291-2.023-4.068-2.583-6.367-1.759-1.069 0.461-6.569 2.447-12.913 3.174-2.992 0.345-5.946-0.108-8.021-0.591 0.067-0.265 0.113-0.539 0.113-0.827 0-0.064-0.017-0.122-0.019-0.188 2.975-0.349 7.621-1.258 11.163-3.598 5.882-3.31 8.937-9.083 9.329-10.598 1.461-3.149 0.21-6.392-2.126-6.901C69.065 28.195 66.707 29.762 65.663 31.972z" fill="#F5C500"/>' +
      '</svg>'
    );
    let bladesCanvas = null;
    imgBlades.onload = function() {
      const sz = Math.ceil(LOGO_FAN_W || 69);
      bladesCanvas = document.createElement('canvas');
      bladesCanvas.width = sz;
      bladesCanvas.height = sz;
      bladesCanvas.getContext('2d').drawImage(imgBlades, 0, 0, sz, sz);
    };

    const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

    const CW = 800;   // logical game width (canvas is half-res, scaled)
    const CH = 1080;  // logical game height
    const TAU = Math.PI * 2;

    const COL_CAULK  = '#FF6B00';
    const COL_GOLD   = '#F5C500';
    const COL_GREEN  = '#00e87a';
    const COL_STREAM = '#d8f2ff';

    const elLives    = document.getElementById('sb-lives');
    const elTimer    = document.getElementById('sb-timer');
    const elCfmValue = document.getElementById('sb-cfm-value');
    const elCfmFill  = document.getElementById('sb-cfm-fill');
    const elScoreBar = document.getElementById('score-bar');

    // ─── Constants ───────────────────────────────────────────────────────────
    const SPEED             = 5;
    const JUMP_FORCE        = -58;   // boosted for floor-to-floor jumping
    const DOUBLE_JUMP_FORCE = -64;   // boosted for floor-to-floor jumping
    const WALL_JUMP_VX      =   8;   // horizontal kick off wall
    const WALL_BOOST_FRAMES =  12;   // frames the kick overrides input
    const GRAVITY_UP = 7.84;         // gravity on ascent (2× heavier)
    const GRAVITY_DN = 0.13;         // gravity on descent (50% slower fall)
    const BULLET_SPEED  = 14;        // caulk projectile px/frame
    const FIRE_COOLDOWN = 18;        // frames between shots (~0.3s)

    let tick = 0; // global frame counter for animations

    // (gradients are now created inline in drawMechanicals — runs once during buildBG)

    // ─── Logo bounds (shared by drawLogo + platform collision) ───────────────
    // SVG brand logo: viewBox="0 0 270 140" — fan x=0 y=20 w=80 h=80
    const LOGO_H   = 120;
    const LOGO_SC  = LOGO_H / 140;               // scale from SVG height (270×140)
    const LOGO_BX  = CW / 2 - 40 * LOGO_SC;     // center fan horiz (fan cx = 40 SVG units)
    const LOGO_BY  = 975;
    const LOGO_FAN_Y = LOGO_BY + 20 * LOGO_SC;  // top of fan square (y=20 in SVG)
    const LOGO_FAN_W = 80 * LOGO_SC;            // fan square size (80 SVG units)
    const LOGO_W   = 270 * LOGO_SC;             // full logo width (270 SVG units)

    // ─── Row home level layout ────────────────────────────────────────────────
    const WALL_L  = 68;   // left brick wall inner edge (30% thicker: was 52)
    const WALL_R  = 732;  // right brick wall inner edge (30% thicker: was 748)
    const F1      = 795;  // basement ceiling / 1st floor surface
    const F2      = 532;  // 1st ceiling / 2nd floor surface
    const F3      = 269;  // 2nd ceiling / 3rd floor
    const FH      = 34;   // floor band thickness (framed floor depth)
    const GAP_W   = 53;   // one joist bay gap (64 spacing - 11 joist width)
    const F1_GAP  = 609;  // F1 gap x: right side (between joist at x=598 and x=662)
    const F2_GAP  = 161;  // F2 gap x: left side (between joist at x=150 and x=214)
    const F3_GAP  = 353;  // F3 gap x: center (between joist at x=342 and x=406)

    // ─── Offscreen canvas for static background (drawn once at render res) ────
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width  = CW * RENDER_SCALE;
    bgCanvas.height = CH * RENDER_SCALE;
    const bgCtx = bgCanvas.getContext('2d');
    bgCtx.scale(RENDER_SCALE, RENDER_SCALE);
    let bgBuilt = false;

    // ─── Player ──────────────────────────────────────────────────────────────
    const player = {
      x: 376,   // start just right of hot water heater (left edge at x=258)
      y: 1000,  // start in basement
      w: 28, h: 38,
      vx: 0, vy: 0,
      onGround: false,
      facing: 1,
      frame: 0,
      jumpsLeft: 2,
      wallKickVx: 0,
      wallKickTimer: 0,
      groundPlatform: null,
    };

    // ─── Platforms ─────────────────────────────────────────────────────────────
    const platforms = [
      // Basement concrete slab — invisible ground (player spawns here)
      { x: 0, y: 1058, w: 800, h: 22, invisible: true },

      // Top of the LES NRG logo — invisible landing surface
      { x: LOGO_BX, y: LOGO_FAN_Y, w: LOGO_W, h: 12, invisible: true },

      // ── House floor surfaces (one-way: land from above, jump through from below) ─
      { x: WALL_L,          y: F1, w: F1_GAP - WALL_L,            h: 8, invisible: true },
      { x: F1_GAP + GAP_W,  y: F1, w: WALL_R - (F1_GAP + GAP_W), h: 8, invisible: true },
      { x: WALL_L,          y: F2, w: F2_GAP - WALL_L,            h: 8, invisible: true },
      { x: F2_GAP + GAP_W,  y: F2, w: WALL_R - (F2_GAP + GAP_W), h: 8, invisible: true },
      { x: WALL_L,          y: F3, w: F3_GAP - WALL_L,            h: 8, invisible: true },
      { x: F3_GAP + GAP_W,  y: F3, w: WALL_R - (F3_GAP + GAP_W), h: 8, invisible: true },


      // ── Win platform ────────────────────────────────────────────────────────
      { x: 610, y: 58, w: 67, h: 16, solid: true },

    ];

    // ─── Solid obstacles (full 4-direction collision) ─────────────────────────
    const solidObstacles = [
      { x: 258, y: 947, w: 52, h: 111 },   // hot water heater
      { x: 575, y: 954, w: 117, h: 104 },   // furnace
    ];

    // ─── Precomputed player tuft angles (constant coords — no atan2 per frame) ─
    const BODY_TUFTS = [[-13,2],[13,2],[-10,9],[10,9]];
    const BODY_TUFT_ANGLES = BODY_TUFTS.map(([tx,ty]) => Math.atan2(ty,tx));
    const HEAD_TUFTS = [[-13,-9],[13,-9],[-10,-15],[10,-15]];
    const HEAD_TUFT_ANGLES = HEAD_TUFTS.map(([tx,ty]) => Math.atan2(ty,tx));

    // ─── Game state ───────────────────────────────────────────────────────────
    const GAME_DURATION    = 60 * 60;  // 60 seconds at 60 fps
    const MAX_LIVES        = 3;
    const INVINCIBLE_FRAMES = 90;      // 1.5s invincibility after hit
    const START_SHIELD_FRAMES = 600;   // 10s invincibility at game start

    let gameOver  = false;
    let gameWon   = false;
    let gameState = 'attract'; // 'attract' | 'playing' | 'gameover' | 'scoreEntry' | 'leaderboard'
    let gameoverTimer = 0;
    const GAMEOVER_DURATION = 180; // 3 seconds at 60fps
    let lives     = MAX_LIVES;
    let cfm       = 5000; // CFM50 infiltration — starts high, player reduces it
    let framesLeft = GAME_DURATION;
    let invincible = 0;               // countdown frames of invincibility
    let startShield = 0;              // countdown frames of start invincibility
    let loseReason = '';              // 'time' | 'lives' | 'fan'
    let bonusFlash = 0;               // countdown frames for full-seal bonus flash
    let floatTexts = [];              // [{wx, wy, text, life}] floating score popups

    // ─── Bullets & Air Leaks ─────────────────────────────────────────────────
    const bullets = [];
    let   fireCooldown = 0;
    const seals  = [];   // caulk marks left on wall after shooting a wall leak
    const leaks  = [];
    let leakTimer = 0;
    const LEAK_INTERVAL = 18; // frames between spawns (~0.3s)

    // Wall crack positions [y, fromLeft] — shared by drawing + air emitters + spawn zones
    const WALL_CRACKS = [
      { y: 343, fromLeft: true  },   // left wall,  2nd floor upper section
      { y: 626, fromLeft: true  },   // left wall,  2nd floor lower section
      { y: 343, fromLeft: false },   // right wall, 2nd floor upper section
      { y: 626, fromLeft: false },   // right wall, 2nd floor lower section
    ];

    // Fixed top-or-bottom edge per window [topY, botY, useTop]
    const WIN_EDGES = [
      [115,       195,        false],  // left  3rd floor window  [0] — bottom
      [380,       460,        true ],  // left  2nd floor window  [1] — top
      [380,       460,        true ],  // right 2nd floor window  [2] — top
      [F1+FH+8,  F1+FH+56,  false],  // left  basement glass block [3] — bottom
      [F1+FH+8,  F1+FH+56,  false],  // right basement glass block [4] — bottom
    ];
    const we = i => WIN_EDGES[i][2] ? WIN_EDGES[i][0] : WIN_EDGES[i][1];

    // ─── Sealable air leak emitters ───────────────────────────────────────────
    // Each: world-space origin (ox, oy) used for bullet hit detection + caulk bead
    const EMITTERS = [
      { ox: WALL_L,  oy: F1 - 114       },  //  0 front door
      { ox: WALL_R,  oy: F1 - 114       },  //  1 back door
      { ox: WALL_L,  oy: we(0)          },  //  2 left 3rd floor window
      { ox: WALL_L,  oy: we(1)          },  //  3 left 2nd floor window
      { ox: WALL_R,  oy: we(2)          },  //  4 right 2nd floor window
      { ox: WALL_L,  oy: we(3)          },  //  5 basement left window
      { ox: WALL_R,  oy: we(4)          },  //  6 basement right window
      { ox: WALL_L,  oy: 343            },  //  7 wall crack left upper
      { ox: WALL_L,  oy: 626            },  //  8 wall crack left lower
      { ox: WALL_R,  oy: 343            },  //  9 wall crack right upper
      { ox: WALL_R,  oy: 626            },  // 10 wall crack right lower
      { ox: 240,     oy: 838            },  // 11 duct trunk 1
      { ox: 460,     oy: 838            },  // 12 duct trunk 2
      { ox: 320,     oy: F3 + FH + 14  },  // 13 duct 2nd floor branch
      { ox: 340,     oy: F2 + FH + 14  },  // 14 duct 1st floor branch
      { ox: 520,     oy: F2 + 80        },  // 15 supply riser
      { ox: WALL_L,  oy: F2 + FH * 0.5 },  // 16 rim joist left
      { ox: WALL_R,  oy: F2 + FH * 0.5 },  // 17 rim joist right
      { ox: 294,     oy: F3 - 12        },  // 18 receptacle
      { ox: 110,     oy: 90             },  // 19 can light 1
      { ox: 220,     oy: 90             },  // 20 can light 2
      { ox: 330,     oy: 90             },  // 21 can light 3
      { ox: WALL_L,  oy: F1 + FH + 132 },  // 22 pipe penetration
      { ox: 570,     oy: F3 + FH       },  // 23 kid room can light
      { ox: 377,     oy: F1 - 12       },  // 24 living room receptacle
    ];
    const sealedEmitters = new Set();

    // Spawn zones — big leaks enter from both sides at every floor [minY, maxY, fromLeft]
    const spawnZones = [
      // 3rd floor (both sides) — listed 3× for higher weight
      [50,       269,          true ],
      [50,       269,          false],
      [50,       269,          true ],
      [50,       269,          false],
      [50,       269,          true ],
      [50,       269,          false],
      // Office ceiling (left side, top of 3rd floor) — extra entries
      [45,       130,          true ],
      [45,       130,          true ],
      [45,       130,          true ],
      // Roof deck (right side, top of 3rd floor) — extra entries
      [45,       130,          false],
      [45,       130,          false],
      [45,       130,          false],
      // 2nd floor (both sides)
      [269+FH,   532,          true ],
      [269+FH,   532,          false],
      // 1st floor (both sides)
      [532+FH,   795,          true ],
      [532+FH,   795,          false],
      // Basement (both sides)
      [795+FH,   1058,         true ],
      [795+FH,   1058,         false],
      // Wall cracks (narrow y range — tight to crack center)
      ...WALL_CRACKS.map(c => [c.y - 10, c.y + 10, c.fromLeft]),
    ];

    // Recessed light x positions (WALL_L+70, then every 110px up to x<400)
    const LIGHT_XS = [110, 220, 330];

    // ─── Audio engine (8-bit Web Audio API) ───────────────────────────────────
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, duration, type, volume, dest) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = volume || 0.2;
      osc.connect(gain);
      gain.connect(dest || audioCtx.destination);
      const t = audioCtx.currentTime;
      osc.start(t);
      osc.stop(t + duration);
      gain.gain.setValueAtTime(volume || 0.2, t);
      gain.gain.linearRampToValueAtTime(0, t + duration);
    }

    function playSlide(startFreq, endFreq, duration, type, volume) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      gain.gain.value = volume || 0.2;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      osc.frequency.setValueAtTime(startFreq, t);
      osc.frequency.linearRampToValueAtTime(endFreq, t + duration);
      gain.gain.setValueAtTime(volume || 0.2, t);
      gain.gain.linearRampToValueAtTime(0, t + duration);
      osc.start(t);
      osc.stop(t + duration);
    }

    function sfxJump() {
      if (gameState === 'attract') return;
      initAudio();
      playSlide(200, 400, 0.08, 'square', 0.15);
    }

          fromWall: true,
        });
        return;
      }

      // 20% chance: spawn from a recessed can light, drifting downward
      if (Math.random() < 0.20) {
        const lx = LIGHT_XS[Math.floor(Math.random() * LIGHT_XS.length)];
        leaks.push({

      ai.jumpWant = false;

      // Find nearest leak

      for (const l of leaks) {
        const dx = (l.x + l.w / 2) - (player.x + player.w / 2);
        const dy = (l.y + l.h / 2) - (player.y + player.h / 2);
        const d = Math.abs(dx) + Math.abs(dy);
        if (d < nearDist) { nearDist = d; nearest = l; }
      }

      if (nearest) {
        const dx = (nearest.x + nearest.w / 2) - (player.x + player.w / 2);
        const dy = (nearest.y + nearest.h / 2) - (player.y + player.h / 2);
        // Move toward leak horizontally
        if (Math.abs(dx) > 30) ai.moveDir = dx > 0 ? 1 : -1;
        else ai.moveDir = 0;
        // Jump if leak is above — double jump when airborne and still need height
        if (dy < -60 && ai.jumpCooldown <= 0) {

    window.addEventListener('gamepadconnected', (e) => { lastGamepadIndex = e.gamepad.index; gamepadMissFrames = 0; });
    window.addEventListener('gamepaddisconnected', () => { lastGamepadIndex = -1; });
    function btn(gp, i) { return gp.buttons[i] ? gp.buttons[i].pressed : false; }
    function pollGamepad() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      let gp = null;
      // prefer last known index, then scan
      if (lastGamepadIndex >= 0 && gamepads[lastGamepadIndex]) {
        gp = gamepads[lastGamepadIndex];
      } else {
        for (let i = 0; i < gamepads.length; i++) { if (gamepads[i]) { gp = gamepads[i]; lastGamepadIndex = i; break; } }
      }
      if (!gp) {
        gamepadMissFrames++;
        if (gamepadMissFrames > GAMEPAD_GRACE) {
          // clear gamepad keys only after grace period
          keys['_gpLeft'] = keys['_gpRight'] = keys['_gpUp'] = keys['_gpDown'] = false;
          keys['_gpJump'] = keys['_gpFire'] = keys['_gpStart'] = keys['_gpSelect'] = false;

      const ax0 = gp.axes.length > 0 ? gp.axes[0] : 0;
      const ax1 = gp.axes.length > 1 ? gp.axes[1] : 0;

      keys['_gpRight']  = dRight;

      keys['_gpDown']   = dDown;

    function overlaps(ax, ay, aw, ah, bx, by, bw, bh) {

    // ─── Update ───────────────────────────────────────────────────────────────
    function update() {
      // Detect wall contact (airborne only)
      const onWallLeft  = !player.onGround && player.x <= WALL_L;
      const onWallRight = !player.onGround && player.x >= WALL_R - player.w;

      // Horizontal — instant, original style
      player.vx = 0;
      if (wantsLeft())  { player.vx = -SPEED; player.facing = -1; }
      if (wantsRight()) { player.vx =  SPEED; player.facing =  1; }

      // Jump (normal + double jump + wall jump) — fires on each new keypress
      const jumpCur   = wantsJump();
      const jumpFresh = jumpCur && !jumpPrev;
      jumpPrev = jumpCur;
      if (jumpFresh) {
        if (player.jumpsLeft > 0) {
          player.vy = player.jumpsLeft === 1 ? DOUBLE_JUMP_FORCE : JUMP_FORCE;
          player.onGround = false;
          player.jumpsLeft--;
          sfxJump();
        } else if (onWallLeft || onWallRight) {
          player.vy          = JUMP_FORCE;
          player.wallKickVx  = onWallLeft ? WALL_JUMP_VX : -WALL_JUMP_VX;
          player.wallKickTimer = WALL_BOOST_FRAMES;
          player.facing      = onWallLeft ? 1 : -1;
          player.jumpsLeft   = 0;
          sfxJump();
        }
      }

      // Wall kick overrides input for a short burst
      if (player.wallKickTimer > 0) {
        player.vx = player.wallKickVx;
        player.wallKickTimer--;
      }

      // Gravity — floaty fall
      const grav = player.vy > 0 ? GRAVITY_DN : GRAVITY_UP;
      player.vy = Math.min(player.vy + grav, 18);

      // Move X — clamp to world edges
      player.x += player.vx;
      player.x = Math.max(WALL_L, Math.min(WALL_R - player.w, player.x));

      // Move Y
      player.y += player.vy;
      player.onGround = false;
      player.groundPlatform = null;

      for (const p of platforms) {
        if (!overlaps(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) continue;
        if (player.vy > 0) {
          const prevBottom = player.y - player.vy + player.h;
          if (prevBottom <= p.y + 4) {
            player.y        = p.y - player.h;
            player.vy       = 0;
            player.onGround = true;
            player.groundPlatform = p;
            player.jumpsLeft = 2;
          }
        } else if (player.vy < 0 && p.solid) {
          // solid platform — block upward movement
          player.y  = p.y + p.h;
          player.vy = 0;
        }
        // non-solid going up — pass through
      }

      // Solid obstacles — full push-out (player can't walk through)
      for (const obs of solidObstacles) {
        if (!overlaps(player.x, player.y, player.w, player.h, obs.x, obs.y, obs.w, obs.h)) continue;
        const oL = (player.x + player.w) - obs.x;
        const oR = (obs.x + obs.w) - player.x;
        const oT = (player.y + player.h) - obs.y;
        const oB = (obs.y + obs.h) - player.y;
        const minO = Math.min(oL, oR, oT, oB);
        if (minO === oT) {
          player.y = obs.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.jumpsLeft = 2;
        } else if (minO === oB) {
          player.y = obs.y + obs.h;
          player.vy = 0;
        } else if (minO === oL) {
          player.x = obs.x - player.w;
        } else {
          player.x = obs.x + obs.w;
        }
      }



      // Fall off bottom — respawn
      if (player.y > CH + 80) {
        resetPlayer();
      }

      // ─── Timer countdown ─────────────────────────────────────────────────────
      framesLeft = Math.max(0, framesLeft - 1);
      if (framesLeft === 0) {
        gameWon = true;
        sfxWin();
        window.parent.postMessage({ type: 'GAME_WIN', score: cfm }, '*');
        return;
      }

      // ─── Fan suck ────────────────────────────────────────────────────────────
      const fanCX2 = LOGO_BX + 40 * LOGO_SC;
      const fanCY2 = LOGO_FAN_Y + LOGO_FAN_W / 2;
      const pdx = fanCX2 - (player.x + player.w / 2);
      const pdy = fanCY2 - (player.y + player.h / 2);
      const pDist2 = pdx * pdx + pdy * pdy;
      if (pDist2 < 14400) { // 120*120
        const pDist = Math.sqrt(pDist2);
        const pull = 0.18 * (1 - pDist / 120);
        player.vx += (pdx / pDist) * pull;
        player.vy += (pdy / pDist) * pull;
      }
      if (pDist2 < 484 && startShield === 0) { // 22*22
        lives--;
        invincible = INVINCIBLE_FRAMES;
        resetPlayer();
        if (lives <= 0) {
          lives = 0;
          loseReason = 'fan';
          gameOver = true;
          sfxWin();
          window.parent.postMessage({ type: 'GAME_LOSE', score: cfm }, '*');
          return;
        }
        sfxHit();
      }

      // ─── Leak hit detection ───────────────────────────────────────────────────
      if (invincible === 0 && startShield === 0) {
        const px = player.x + 6, py = player.y + 6, pw = player.w - 12, ph = player.h - 12;
        for (const l of leaks) {
          if (overlaps(px, py, pw, ph, l.x + l.w * 0.2, l.y + l.h * 0.2, l.w * 0.6, l.h * 0.6)) {
            lives--;
            invincible = INVINCIBLE_FRAMES;
            if (lives <= 0) {
              lives = 0;
              loseReason = 'lives';
              gameOver = true;
              sfxWin();
              window.parent.postMessage({ type: 'GAME_LOSE', score: cfm }, '*');
              return;
            }
            sfxHit();
            break;
          }
        }
      }
      if (invincible > 0) invincible--;
      if (startShield > 0) startShield--;

      // ─── Caulk gun ───────────────────────────────────────────────────────────
      if (fireCooldown > 0) fireCooldown--;
      if (wantsFire() && fireCooldown === 0) { spawnBullet(); sfxShoot(); }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const bxPrev = b.x;          // position before moving — needed for sweep check
        b.x += b.vx;
        if (b.x > CW + 60 || b.x < -60) { bullets.splice(i, 1); continue; }
        let hit = false;
        for (let j = leaks.length - 1; j >= 0; j--) {
          const l = leaks[j];
          let isHit = false;
          if (l.fromWall) {
            // Wall/AC leaks: wide sweep in both directions so the bullet hits
            // regardless of which way the player faces or which way the leak moves.
            const sweepX = Math.min(bxPrev, b.x) - 150;
            const sweepW = Math.abs(b.vx) + b.w + 300;
            const sweepY = b.y - 100;
            const sweepH = b.h + 200;
            isHit = overlaps(sweepX, sweepY, sweepW, sweepH, l.x, l.y, l.w, l.h);
          } else {
            // Traversing leaks: directional sweep
            const sweepX = Math.min(bxPrev, b.x);
            const sweepW = Math.abs(b.vx) + b.w;
            const sweepY = b.y - 20;
            const sweepH = b.h + 40;
            isHit = overlaps(sweepX, sweepY, sweepW, sweepH, l.x, l.y, l.w, l.h);
          }
          if (isHit) {
            leaks.splice(j, 1);
            cfm = Math.max(0, cfm - 50); // big leak: -50 CFM
            floatTexts.push({ wx: player.x + 16, wy: player.y - 10, text: '−50', life: 65 });
            hit = true;
            break;
          }
        }
        // Check emitter sources (particle streams at walls/cracks/ducts)
        if (!hit) {
          const bCX = b.x + b.w / 2;
          const bCY = b.y + b.h / 2;
          for (let e = 0; e < EMITTERS.length; e++) {
            if (sealedEmitters.has(e)) continue;
            const em = EMITTERS[e];
            if (Math.abs(bCX - em.ox) < 40 && Math.abs(bCY - em.oy) < 40) {
              sealedEmitters.add(e);
              cfm = Math.max(0, cfm - 100); // LL seal: -100 CFM
              floatTexts.push({ wx: player.x + 16, wy: player.y - 10, text: '−100', life: 65 });
              sfxSeal();
              // Bonus: seal ALL emitters → -2000 CFM
              if (sealedEmitters.size === EMITTERS.length) {
                cfm = Math.max(0, cfm - 1000);
                bonusFlash = 240; // show for 4 seconds
              }
              hit = true;
              break;
            }
          }
        }
        if (hit) { bullets.splice(i, 1); }
      }

      // ─── Big leaks — max 4 on screen ─────────────────────────────────────
      const heightFrac = 1 - Math.max(0, Math.min(1, player.y / CH)); // 0=bottom, 1=top
      const dynInterval = Math.round(70 - heightFrac * 30); // 70 frames at bottom → 40 at top
      leakTimer++;
      if (leakTimer >= dynInterval && leaks.length < 4) {
        spawnLeak();
        leakTimer = 0;
      }
      // Keep minimum 2 on screen
      if (leaks.length < 2) {
        spawnLeak();
      }

      // Fan center — leaks get pulled toward it
      const fanCX = LOGO_BX + 40 * LOGO_SC;
      const fanCY = LOGO_FAN_Y + LOGO_FAN_W / 2;

      for (let i = leaks.length - 1; i >= 0; i--) {
        const lcx = leaks[i].x + leaks[i].w / 2;
        const lcy = leaks[i].y + leaks[i].h / 2;
        const dx   = fanCX - lcx;
        const dy   = fanCY - lcy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Sucked into the fan — remove when inside the fan circle
        if (dist < 26) {
          leaks.splice(i, 1);
          continue;
        }

        leaks[i].distToFan = dist;

        // Drag + pull in both axes — spirals reliably into fan
        leaks[i].vx *= 0.985;
        leaks[i].vy *= 0.985;
        leaks[i].vx += (dx / dist) * 0.06;
        leaks[i].vy += (dy / dist) * 0.06;

        const moveX = leaks[i].vx;
        const moveY = leaks[i].vy;
        leaks[i].x += moveX;
        leaks[i].y += moveY;

        // Smooth angle from actual velocity
        const targetAngle = Math.atan2(moveY, moveX);
        let da = targetAngle - leaks[i].angle;
        while (da >  Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        leaks[i].angle += da * 0.15;

        // Remove when off screen
        if (leaks[i].x > CW + 100 || leaks[i].x < -100) {
          leaks.splice(i, 1);
          continue;
        }

        // Push player in wind direction
        if (overlaps(player.x, player.y, player.w, player.h,
                     leaks[i].x, leaks[i].y, leaks[i].w, leaks[i].h)) {
          player.x += moveX * 4.5;
          player.x = Math.max(WALL_L, Math.min(WALL_R - player.w, player.x));
        }
      }

      // Walk animation
      if (player.vx !== 0) player.frame++;
      tick++;

    }

    // ─── Draw ─────────────────────────────────────────────────────────────────

    function drawBrickWall(x, y, w, h) {
      const bH = 11, bW = 26, mV = 3, mH = 3;
      ctx.fillStyle = '#6a2810';
      ctx.fillRect(x, y, w, h);
      for (let row = 0; row * (bH + mV) < h + bH; row++) {
        const by = y + row * (bH + mV);
        const odd = row % 2;
        for (let col = -1; col * (bW + mH) < w + bW; col++) {
          const bx = x + col * (bW + mH) + odd * ((bW + mH) / 2);
          const shade = (row * 5 + col * 7) % 3;
          ctx.fillStyle = shade === 0 ? '#9B4020' : shade === 1 ? '#8B3515' : '#7a2f12';
          const rx = Math.max(bx, x), rw = Math.min(bx + bW, x + w) - rx;
          const ry = Math.max(by + mV, y), rh2 = Math.min(by + bH + mV, y + h) - ry;
          if (rw > 0 && rh2 > 0) ctx.fillRect(rx, ry, rw, rh2);
        }
      }
    }

    function drawStoneWall(x, y, w, h) {
      // Dark mortar base
      ctx.fillStyle = '#282826';
      ctx.fillRect(x, y, w, h);
      // Brown and white mineral speckles (deterministic per position)
      for (let si = 0; si < 28; si++) {
        const hx2 = ((si * 6301 + 982) * 1234567 % 1000) / 1000;
        const hy2 = ((si * 7919 + 4321) * 9876543 % 1000) / 1000;
        const sz  = ((si * 3137 + 111)  * 2345678 % 1000) / 1000;
        const isBrown = si % 3 !== 0;
        const sx3 = x + hx2 * w;
        const sy3 = y + hy2 * h;
        ctx.fillStyle = isBrown
          ? `rgba(107,76,40,${0.35 + sz * 0.3})`
          : `rgba(220,210,200,${0.3 + sz * 0.4})`;
        ctx.beginPath();
        ctx.arc(sx3, sy3, 1 + sz * 2, 0, TAU);
        ctx.fill();
      }
      // Irregular stone blocks
      const stones = [
        // each entry: [relX, relY, sW, sH, shade]  0=dark 1=mid 2=light
        [1,0,38,16,1],[40,0,20,14,0],[62,2,28,12,2],[1,17,24,18,0],[26,16,34,14,1],
        [1,36,30,16,2],[32,35,20,17,0],[53,35,36,15,1],[1,53,44,15,1],[46,52,24,16,0],
        [1,69,28,17,0],[30,68,42,16,2],[1,86,36,15,1],[38,85,32,17,0],[1,103,26,16,2],
        [28,102,44,15,1],[1,119,38,14,0],[40,118,30,16,1],[1,136,46,16,2],[48,135,22,17,0],
      ];
      const cols = ['#3a3a36','#484844','#424240'];
      for (const [sx, sy, sw, sh, c] of stones) {
        if (sx >= w || sy >= h) continue;
        const cw = Math.min(sw, w - sx - 1), ch = Math.min(sh, h - sy - 1);
        if (cw < 2 || ch < 2) continue;
        ctx.fillStyle = cols[c];
        ctx.fillRect(x + sx, y + sy, cw, ch);
        // Slight highlight on top-left edge
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(x + sx, y + sy, cw, 2);
        ctx.fillRect(x + sx, y + sy, 2, ch);
        // Shadow on bottom-right
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(x + sx, y + sy + ch - 2, cw, 2);
        ctx.fillRect(x + sx + cw - 2, y + sy, 2, ch);
      }
    }

    function drawFloorBand(y, gapX) {
      const pw = WALL_R - WALL_L;

      // Clip to exclude gap zone so floor elements don't draw there
      ctx.save();
      if (gapX !== undefined) {
        ctx.beginPath();
        ctx.rect(WALL_L, y - 1, gapX - WALL_L, FH + 2);
        ctx.rect(gapX + GAP_W, y - 1, WALL_R - (gapX + GAP_W), FH + 2);
        ctx.clip();
      }

      // Dark cavity fill (air between joists)
      ctx.fillStyle = '#141210';
      ctx.fillRect(WALL_L, y, pw, FH);

      // ── Finished floor surface (hardwood oak) ────────────────────────────
      ctx.fillStyle = '#f0cc80';
      ctx.fillRect(WALL_L, y, pw, 4);
      ctx.fillStyle = '#d8a850';
      ctx.fillRect(WALL_L, y + 1, pw, 1);          // shadow line under top
      ctx.strokeStyle = '#c09040'; ctx.lineWidth = 0.5;
      for (let sx = WALL_L + 42; sx < WALL_R; sx += 42) {
        ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx, y + 4); ctx.stroke();
      }

      // ── Floor joists in cross-section (same style as roof rafters) ───────
      for (let jx = WALL_L + 18; jx < WALL_R - 10; jx += 64) {
        ctx.fillStyle = '#4a3018';
        ctx.fillRect(jx, y + 4, 11, FH - 7);
        ctx.fillStyle = '#3a2010';            // end grain face
        ctx.fillRect(jx + 2, y + 6, 7, FH - 11);
        ctx.strokeStyle = '#5a4028'; ctx.lineWidth = 0.5;
        ctx.strokeRect(jx, y + 4, 11, FH - 7);
      }

      // ── Drywall ceiling (bottom of assembly, ceiling of room below) ──────
      ctx.fillStyle = '#c4c0b8';
      ctx.fillRect(WALL_L, y + FH - 3, pw, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(WALL_L, y + FH - 3, pw, 1);
      ctx.strokeStyle = '#a8a49c'; ctx.lineWidth = 1;
      for (let sx = WALL_L + 120; sx < WALL_R; sx += 120) {
        ctx.beginPath(); ctx.moveTo(sx, y + FH - 3); ctx.lineTo(sx, y + FH); ctx.stroke();
      }

      ctx.restore();

      // ── Gap: open hole with yellow side markers and down arrow ────────────
      if (gapX !== undefined) {
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(gapX, y, GAP_W, FH);
        // Yellow side posts
        ctx.fillStyle = '#F5C500';
        ctx.fillRect(gapX, y, 3, FH);
        ctx.fillRect(gapX + GAP_W - 3, y, 3, FH);
        // Down arrow
        const ax = gapX + GAP_W / 2;
        const ay = y + FH / 2 + 2;
        ctx.beginPath();
        ctx.moveTo(ax - 9, ay - 7);
        ctx.lineTo(ax + 9, ay - 7);
        ctx.lineTo(ax, ay + 7);
        ctx.closePath();
        ctx.fill();
      }
    }


    function drawWallWindow(x, y, w, h) {
      // Frame
      ctx.fillStyle = '#2a1408';
      ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
      // Glass — sky blue-white
      ctx.fillStyle = '#a8d4ee';
      ctx.fillRect(x, y, w, h);
      // Upper highlight (lighter / sky)
      ctx.fillStyle = '#cce8f8';
      ctx.fillRect(x + 1, y + 1, w / 2 - 2, h / 2 - 2);
      // Lower pane (slightly darker blue)
      ctx.fillStyle = '#88b8d8';
      ctx.fillRect(x, y + h / 2, w, h / 2);
      // Muntins
      ctx.fillStyle = '#2a1408';
      ctx.fillRect(x + w / 2 - 1, y, 2, h);
      ctx.fillRect(x, y + h / 2 - 1, w, 2);
    }

    function drawGlassBlockWindow(x, y, w, h) {
      const cols = 2, rows = 3, mortar = 3;
      const bw = (w - mortar * (cols + 1)) / cols;
      const bh = (h - mortar * (rows + 1)) / rows;
      // Frame
      ctx.fillStyle = '#2a1408';
      ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
      // Mortar bed
      ctx.fillStyle = '#7a7870';
      ctx.fillRect(x, y, w, h);
      // Glass blocks
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const bx = x + mortar + c * (bw + mortar);
          const by = y + mortar + r * (bh + mortar);
          ctx.fillStyle = '#a0c8e0';
          ctx.fillRect(bx, by, bw, bh);
          // Bright top-left highlight
          ctx.fillStyle = '#d4eef8';
          ctx.fillRect(bx + 1, by + 1, bw * 0.55, bh * 0.45);
          // Bottom-right shadow
          ctx.fillStyle = '#6aa0c0';
          ctx.fillRect(bx, by + bh * 0.6, bw, bh * 0.4);
          ctx.fillRect(bx + bw * 0.6, by, bw * 0.4, bh * 0.6);
        }
      }
    }

    function drawFrontDoor(floorY) {

    function drawBackDoor(floorY) {

    function drawDuctwork() {
      const M = '#7a7a76';   // duct body (galvanized grey)
      const L = '#b0b0ac';   // light edge highlight
      const D = '#4e4e4c';   // dark shadow edge
      const S = '#5c5c5a';   // seam joint color

      function hDuct(x, y, w, h) {
        ctx.fillStyle = M; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = L; ctx.fillRect(x, y, w, Math.ceil(h * 0.16));
        ctx.fillStyle = D; ctx.fillRect(x, y + h - Math.ceil(h * 0.16), w, Math.ceil(h * 0.16));
      }
      function vDuct(x, y, w, h) {
        ctx.fillStyle = M; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = L; ctx.fillRect(x, y, Math.ceil(w * 0.22), h);
        ctx.fillStyle = D; ctx.fillRect(x + w - Math.ceil(w * 0.22), y, Math.ceil(w * 0.22), h);
      }
      function hSeams(x, y, w, h, step) {
        ctx.strokeStyle = S; ctx.lineWidth = 1;
        for (let sx = x + step; sx < x + w - 4; sx += step) {
          ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx, y + h); ctx.stroke();
        }
      }
      function vSeams(x, y, w, h, step) {
        ctx.strokeStyle = S; ctx.lineWidth = 1;
        for (let sy = y + step; sy < y + h - 4; sy += step) {
          ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + w, sy); ctx.stroke();
        }
      }
      function supplyRegister(x, y, h) {
        ctx.fillStyle = D; ctx.fillRect(x, y, 16, h);
        ctx.strokeStyle = '#3a3a38'; ctx.lineWidth = 0.8;
        for (let gx = x + 3; gx < x + 14; gx += 4) {
          ctx.beginPath(); ctx.moveTo(gx, y + 1); ctx.lineTo(gx, y + h - 1); ctx.stroke();
        }
      }

      // ── Main supply trunk (basement ceiling, hangs below F1 floor band) ────
      const tX1 = 98, tX2 = 575, tY = 838, tH = 26;
      hDuct(tX1, tY, tX2 - tX1, tH);
      hSeams(tX1, tY, tX2 - tX1, tH, 72);
      ctx.fillStyle = D; ctx.fillRect(tX1, tY, 3, tH);          // left end cap
      // Transition plenum where trunk meets furnace (sits on top of furnace)
      ctx.fillStyle = M; ctx.fillRect(tX2, tY - 7, 34, tH + 7);
      ctx.fillStyle = L; ctx.fillRect(tX2, tY - 7, 34, 3);
      ctx.strokeStyle = S; ctx.lineWidth = 1;
      ctx.strokeRect(tX2, tY - 7, 34, tH + 7);
      // Vertical supply drop — connects plenum directly to furnace top
      vDuct(tX2 + 1, tY + tH, 31, 954 - (tY + tH));
      vSeams(tX2 + 1, tY + tH, 31, 954 - (tY + tH), 40);
      ctx.strokeStyle = S; ctx.lineWidth = 1;
      ctx.strokeRect(tX2 + 1, tY + tH, 31, 954 - (tY + tH));

      // ── Supply riser (vertical, from trunk up to 2nd floor ceiling) ─────────
      const rX = 520, rW = 18;
      vDuct(rX, F3 + FH, rW, tY - (F3 + FH));     // F3+FH=222 down to trunk
      vSeams(rX, F3 + FH, rW, tY - (F3 + FH), 80);
      // Cap at top of riser
      ctx.fillStyle = D; ctx.fillRect(rX, F3 + FH, rW, 3);
      // Reinforced sleeves where riser penetrates floor bands (F1 and F2 only)
      for (const fy of [F2, F1]) {
        ctx.fillStyle = '#686864';
        ctx.fillRect(rX - 3, fy, rW + 6, FH);
        ctx.fillStyle = L; ctx.fillRect(rX - 1, fy, rW + 2, 2);
        ctx.strokeStyle = D; ctx.lineWidth = 1;
        ctx.strokeRect(rX - 3, fy, rW + 6, FH);
      }

      // ── Branch ducts (2nd floor and 1st floor only) ──────────────────────
      const bH = 12;

      // 2nd floor branch (F3 + FH + 14 = 236)
      const b2Y = F3 + FH + 14;
      hDuct(195, b2Y, rX - 195, bH);
      hSeams(195, b2Y, rX - 195, bH, 60);
      supplyRegister(178, b2Y - 1, bH + 2);

      // 1st floor branches — left (living room) and right (kitchen)
      const b1Y = F2 + FH + 14;   // = 434
      hDuct(215, b1Y, rX - 215, bH);         // living room (left)
      hSeams(215, b1Y, rX - 215, bH, 60);
      supplyRegister(198, b1Y - 1, bH + 2);
      hDuct(rX + rW, b1Y, 624 - (rX + rW), bH);  // kitchen (right)
      hSeams(rX + rW, b1Y, 624 - (rX + rW), bH, 60);
      supplyRegister(624, b1Y - 1, bH + 2);

      // ── Return air grilles (flat wall grilles, left side, each floor) ──────

    function drawInteriorWalls() {
      // Interior drywall assembly on inside face of each exterior wall
      // From outside in: [brick/stone] → [air gap] → [furring strips] → [drywall face]
      const gapW  = 7;    // air gap width (px)
      const dwW   = 5;    // drywall face thickness (px)
      const top   = 90;   // start below roof drywall
      const bot   = F1 + FH; // stop at basement — no drywall below grade
      const span  = bot - top;

      // ── Left wall (air gap at x=40–45, drywall face at x=45–49) ────────────
      // Air gap void
      ctx.fillStyle = '#181614';
      ctx.fillRect(WALL_L, top, gapW, span);

      // Drywall face
      ctx.fillStyle = '#d4d0c8';
      ctx.fillRect(WALL_L + gapW, top, dwW, span);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';  // left edge shadow
      ctx.fillRect(WALL_L + gapW, top, 1, span);
      // Horizontal panel seams
      ctx.strokeStyle = '#b0aca4'; ctx.lineWidth = 0.8;
      for (let sy = top + 96; sy < bot; sy += 96) {
        ctx.beginPath();
        ctx.moveTo(WALL_L + gapW, sy);
        ctx.lineTo(WALL_L + gapW + dwW, sy);
        ctx.stroke();
      }

      // ── Right wall — starts at F3 (above is open outside terrace) ──────────
      const rTop  = F3;
      const rSpan = bot - rTop;
      // Drywall face
      ctx.fillStyle = '#d4d0c8';
      ctx.fillRect(WALL_R - gapW - dwW, rTop, dwW, rSpan);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(WALL_R - gapW - 1, rTop, 1, rSpan);
      ctx.strokeStyle = '#b0aca4'; ctx.lineWidth = 0.8;

        ctx.beginPath();
        ctx.moveTo(WALL_R - gapW - dwW, sy);
        ctx.lineTo(WALL_R - gapW, sy);
        ctx.stroke();

      ctx.fillStyle = '#181614';
      ctx.fillRect(WALL_R - gapW, rTop, gapW, rSpan);

    function drawWallCracks() {
      // Cracks span full 40px wall thickness, outer face (x=0/800) to inner face (x=40/760)
      // pts = [dx_from_outer_face, dy_from_crack_center], dx goes 0 → 40
      const crackShapes = [
        { pts: [[0,-5],[10,-10],[21,0],[31,-7],[42,3],[52,-1]],  branch: [2, [21,-17],[29,-25]] },
        { pts: [[0,3],[10,-5],[21,7],[31,-3],[42,8],[52,1]],     branch: [3, [31,12],[39,20]]   },
        { pts: [[0,-3],[10,5],[21,-4],[31,7],[42,-3],[52,1]],    branch: [2, [21,-12],[29,-22]] },
        { pts: [[0,4],[10,-7],[21,5],[31,-8],[42,7],[52,-3]],    branch: [3, [31,-14],[39,-23]] },
      ];

      ctx.lineCap   = 'round';
      ctx.lineJoin  = 'round';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';

      WALL_CRACKS.forEach((crack, ci) => {
        const shape = crackShapes[ci];
        const wx    = crack.fromLeft ? 0 : CW;   // outer face of wall
        const dir   = crack.fromLeft ? 1 : -1;    // direction through wall
        const cy    = crack.y;

        // Dark gap shadow
        ctx.strokeStyle = '#0a0604';
        ctx.lineWidth   = 2.5;
        ctx.shadowBlur  = 4;
        ctx.beginPath();
        shape.pts.forEach(([dx, dy], i) => {
          const px = wx + dir * dx, py = cy + dy;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        });
        ctx.stroke();

        // Branch crack
        const [bi, ...bpts] = shape.branch;
        const [bsx, bsy] = shape.pts[bi];
        ctx.beginPath();
        ctx.moveTo(wx + dir * bsx, cy + bsy);
        bpts.forEach(([dx, dy]) => ctx.lineTo(wx + dir * dx, cy + dy));
        ctx.stroke();

        // Lighter highlight rim on interior side
        ctx.strokeStyle = '#5a3020';
        ctx.lineWidth   = 1;
        ctx.shadowBlur  = 0;
        ctx.beginPath();
        shape.pts.forEach(([dx, dy], i) => {
          const px = wx + dir * dx + dir, py = cy + dy;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        });
        ctx.stroke();
      });

      ctx.shadowBlur = 0;
    }

    function drawAirLeakSources() {
      ctx.save();
      ctx.lineCap    = 'round';
      ctx.shadowBlur  = 0;

      ctx.strokeStyle = COL_STREAM;

      // Single animated streak: starts tiny at source, grows as it travels inward
      // sc = size scale (1 = normal, 2 = double, etc.)
      function stream(ox, oy, dx, dy, ph, sc = 1) {
        const t     = ((tick * 0.013 + ph) % 1.0);
        const dist  = t * 52 * sc;
        const len   = t * 24 * sc;
        const alpha = t < 0.18 ? t / 0.18 : (1 - t);
        const w     = 2.5 * sc + t * 7.0 * sc;
        const hx    = ox + dx * dist,  hy = oy + dy * dist;
        const tx    = hx  - dx * len,  ty = hy  - dy * len;
        ctx.globalAlpha = Math.max(0, alpha) * 0.88;
        // Soft bloom underlay
        ctx.lineWidth   = w * 3;
        ctx.globalAlpha *= 0.15;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        // Main streak
        ctx.globalAlpha = Math.max(0, alpha) * 0.88;
        ctx.lineWidth   = w;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(hx, hy);
        ctx.stroke();
      }

      // Helper: emit N parallel streams spread along the perpendicular axis
      function emit(ox, oy, dx, dy, spread, n, phOffset, sc = 1, phases = 1) {
        const px = dy, py = -dx;  // perpendicular direction
        for (let i = 0; i < n; i++) {
          const s  = (i / (n - 1) - 0.5) * spread;
          const ph = i / n + phOffset;
          for (let p = 0; p < phases; p++) {
            stream(ox + px * s, oy + py * s, dx, dy, ph + p / phases, sc);
          }
        }
      }

      const SC = 1.5;  // all leaks same scale — 100%+ larger than before
      const SE = sealedEmitters;

      // ── Front door — air at top of door frame ──────────────────────────────
      if (!SE.has(0)) emit(WALL_L, F1 - 114, 1, 0, 12, 5, 0.0, SC);

      // ── Back door — air at top of door frame ───────────────────────────────
      if (!SE.has(1)) emit(WALL_R, F1 - 114, -1, 0, 12, 5, 0.1, SC);

      // ── Left wall windows ──────────────────────────────────────────────────
      if (!SE.has(2)) emit(WALL_L, we(0), 1, 0, 8, 5, 0.07, SC);  // 3rd floor
      if (!SE.has(3)) emit(WALL_L, we(1), 1, 0, 8, 5, 0.14, SC);  // 2nd floor

      // ── Right wall windows ─────────────────────────────────────────────────
      if (!SE.has(4)) emit(WALL_R, we(2), -1, 0, 8, 5, 0.21, SC);

      // ── Basement glass block windows ───────────────────────────────────────
      if (!SE.has(5)) emit(WALL_L, we(3),  1, 0, 8, 5, 0.35, SC);
      if (!SE.has(6)) emit(WALL_R, we(4), -1, 0, 8, 5, 0.42, SC);

      // ── Wall cracks ────────────────────────────────────────────────────────
      WALL_CRACKS.forEach((crack, ci) => {
        if (SE.has(7 + ci)) return;
        const wx = crack.fromLeft ? WALL_L : WALL_R;
        const dx = crack.fromLeft ? 1 : -1;
        emit(wx, crack.y, dx, 0, 10, 4, ci * 0.15 + 0.6, SC * 0.7);
      });

      // ── Duct leaks ─────────────────────────────────────────────────────────
      const DS = SC * 0.675;
      if (!SE.has(11)) emit(240, 838,           0,  1, 8, 3, 0.55, DS);
      if (!SE.has(12)) emit(460, 838,           0,  1, 8, 3, 0.62, DS);
      if (!SE.has(13)) emit(320, F3 + FH + 14, 0,  1, 6, 3, 0.70, DS);
      if (!SE.has(14)) emit(340, F2 + FH + 14, 0,  1, 6, 3, 0.77, DS);
      if (!SE.has(15)) emit(520, F2 + 80,      -1,  0, 14, 4, 0.84, DS * 1.4);

      // ── Rim joist leaks ────────────────────────────────────────────────────
      if (!SE.has(16)) emit(WALL_L, F2 + FH * 0.5,  1, 0, FH - 6, 3, 0.18, SC * 0.85);
      if (!SE.has(17)) emit(WALL_R, F2 + FH * 0.5, -1, 0, FH - 6, 3, 0.26, SC * 0.85);

      // ── Office receptacle ──────────────────────────────────────────────────
      if (!SE.has(18)) emit(294, F3 - 12, 0, -1, 14, 4, 0.48, SC * 1.0);

      // ── Living room receptacle ─────────────────────────────────────────────
      if (!SE.has(24)) emit(377, F1 - 12, 0, -1, 14, 4, 0.52, SC * 1.0);

      // ── Recessed can lights ────────────────────────────────────────────────
      for (const [lx, ph, ei] of [[110, 0.33, 19], [220, 0.41, 20], [330, 0.50, 21]]) {
        if (SE.has(ei)) continue;
        emit(lx +  9, 90, -0.3, 0.95, 6, 3, ph,        SC * 0.55);
        emit(lx + 41, 90,  0.3, 0.95, 6, 3, ph + 0.05, SC * 0.55);
      }

      // ── Pipe penetration ───────────────────────────────────────────────────
      if (!SE.has(22)) emit(WALL_L, F1 + FH + 132, 0.4, -0.92, 4, 2, 0.80, SC * 0.9);

      // ── Kid room can lights (2nd floor ceiling) ────────────────────────────
      for (const [lx, ph, ei] of [[570, 0.55, 23]]) {
        if (SE.has(ei)) continue;
        emit(lx - 16, F3 + FH, -0.3, 0.95, 6, 3, ph,        SC * 0.55);
        emit(lx + 16, F3 + FH,  0.3, 0.95, 6, 3, ph + 0.05, SC * 0.55);
      }

      // ── Caulk beads at sealed sources ──────────────────────────────────────
      ctx.globalAlpha = 1;
      for (let i = 0; i < EMITTERS.length; i++) {
        if (!SE.has(i)) continue;
        const em = EMITTERS[i];
        // Main bead
        ctx.fillStyle = '#FF6B00';
        ctx.beginPath();
        ctx.arc(em.ox, em.oy, 7, 0, TAU);
        ctx.fill();
        // Dark outline
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Highlight dot
        ctx.fillStyle = '#FFB347';
        ctx.beginPath();
        ctx.arc(em.ox - 2, em.oy - 2, 3, 0, TAU);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawLeak(leak) {
      const sy = leak.y;
      if (sy + leak.h < -10 || sy > CH + 10) return;

      const cx = leak.x + leak.w / 2;
      const cy = sy   + leak.h / 2;
      const hw = leak.w / 2;
      const hh = leak.h / 2;

      // Fade out as it nears the fan
      const fanDist  = leak.distToFan || 999;
      const fadeAlpha = Math.min(1, fanDist / 60);

      ctx.save();
      ctx.globalAlpha = fadeAlpha;
      ctx.translate(cx, cy);
      ctx.rotate(leak.angle || 0);
      ctx.lineCap = 'round';
      ctx.shadowBlur = 0;

      // Glow halo — single wide transparent stroke using center line path
      {
        const lineY   = 0;
        const phase   = tick * 0.09 + 0.75;
        const amp     = 5;
        const lineLen = hw * 2 * 0.52;
        const startX  = -lineLen / 2;
        const segs = 2, segW = lineLen / segs;
        ctx.globalAlpha = 0.12;
        ctx.strokeStyle = '#aaddff';
        ctx.lineWidth   = 12;
        let curX = startX, curY = lineY + fsin(phase) * amp;
        ctx.beginPath();
        ctx.moveTo(curX, curY);
        for (let s = 0; s < segs; s++) {
          const ph1 = phase + (s + 1) * 1.4;
          const nx  = curX + segW;
          const ny  = lineY + fsin(ph1) * amp;
          ctx.bezierCurveTo(curX + segW * 0.35, lineY + fsin(phase + s * 1.4 + 0.5) * amp * 1.7,
                            nx - segW * 0.35, lineY + fsin(ph1 - 0.5) * amp * 1.7, nx, ny);
          curX = nx; curY = ny;
        }
        ctx.stroke();
      }

      const lineCount = 3;
      for (let li = 0; li < lineCount; li++) {
        const lineY   = (li - (lineCount - 1) / 2) * (leak.h / lineCount);
        const phase   = tick * 0.09 + li * 0.75;
        const amp     = 5 + li % 3 * 2;
        const lineLen = hw * 2 * (0.52 + (li % 3) * 0.14);
        const startX  = -lineLen / 2;
        const alpha   = 0.90 - li * 0.08;

        ctx.globalAlpha = alpha;
        ctx.strokeStyle = li % 3 === 1 ? '#ffffff' : li % 3 === 2 ? '#cceeff' : '#aaddff';
        ctx.lineWidth   = 4.0 - li * 0.3;

        const segs = 2, segW = lineLen / segs;
        let curX = startX;
        let curY = lineY + fsin(phase) * amp;
        ctx.beginPath();
        ctx.moveTo(curX, curY);
        for (let s = 0; s < segs; s++) {
          const ph1  = phase + (s + 1) * 1.4;
          const nx   = curX + segW;
          const ny   = lineY + fsin(ph1) * amp;
          const cp1x = curX + segW * 0.35;
          const cp1y = lineY + fsin(phase + s * 1.4 + 0.5) * amp * 1.7;
          const cp2x = nx - segW * 0.35;
          const cp2y = lineY + fsin(ph1 - 0.5) * amp * 1.7;
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, nx, ny);
          curX = nx; curY = ny;
        }
        ctx.stroke();

        ctx.globalAlpha = alpha * 0.9;
        ctx.beginPath();
        ctx.moveTo(curX,      curY);
        ctx.lineTo(curX - 10, curY - 5);
        ctx.moveTo(curX,      curY);
        ctx.lineTo(curX - 10, curY + 5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawSeals() {
      if (!seals.length) return;
      for (const s of seals) {
        const sx = s.x;
        const sy = s.y;
        // Outer glow — wide smear to cover the sealed leak area
        ctx.fillStyle = 'rgba(255,107,0,0.25)';
        fillEllipse(sx, sy, 52, 16);
        // Main caulk smear
        ctx.fillStyle = '#FF6B00';
        fillEllipse(sx, sy, 40, 10);
        // Highlight ridge
        ctx.fillStyle = '#FFB347';
        fillEllipse(sx - 6, sy - 2, 20, 4);
      }
    }

    function drawBullets() {
      if (!bullets.length) return;
      for (const b of bullets) {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        // Glow
        ctx.fillStyle = 'rgba(255,120,0,0.25)';
        fillEllipse(cx, cy, b.w, b.h);
        // Main blob
        ctx.fillStyle = '#FF6B00';
        fillEllipse(cx, cy, b.w / 2, b.h / 2);
        // Bright core
        ctx.fillStyle = '#FFB347';
        fillEllipse(cx, cy, b.w / 3.5, b.h / 3.5);
      }
    }

    function updateScoreBar() {
      if (tick % 6 !== 0) return; // throttle DOM updates
      const livesEl = elLives;
      const timerEl = elTimer;
      const cfmVal  = elCfmValue;
      const cfmFill = elCfmFill;

      // Lives
      let hearts = '';
      for (let i = 0; i < MAX_LIVES; i++) hearts += i < lives ? '♥ ' : '♡ ';
      livesEl.textContent = hearts.trim();
      livesEl.style.color = '#ff3355';

      // Timer
      const totalSecs = Math.ceil(framesLeft / 60);
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      timerEl.style.color = framesLeft < 600 ? '#ff3355' : 'rgba(255,255,255,0.9)';

      // CFM manometer
      const cfmRatio = cfm / 5000;
      const cfmColor = cfmRatio > 0.75 ? '#ff3333'
                     : cfmRatio > 0.5  ? '#ff8800'
                     : cfmRatio > 0.25 ? '#F5C500'
                     : '#00e87a';
      cfmVal.textContent = cfm.toLocaleString();
      cfmVal.style.color = cfmColor;
      cfmFill.style.width = (cfmRatio * 100) + '%';
      cfmFill.style.background = cfmColor;

    function drawLogo() {
      const fanX  = LOGO_BX;
      const fanY  = LOGO_FAN_Y;
      const fanW  = LOGO_FAN_W;
      const fanCX = fanX + fanW / 2;
      const fanCY = fanY + fanW / 2;
      const sc    = LOGO_SC;

      ctx.save();

      // ── Yellow rounded square (fan housing) ──
      ctx.fillStyle = '#F5C500';
      ctx.beginPath();
      ctx.roundRect(fanX, fanY, fanW, fanW, 9 / 82.977 * fanW);
      ctx.fill();

      // ── White hub circle ──
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(fanCX, fanCY, 31.72 / 82.977 * fanW, 0, TAU);
      ctx.fill();

      // ── Spinning blade image (pre-rasterized) ──
      const bladeImg = bladesCanvas || imgBlades;
      if (bladeImg.width > 0) {
        ctx.save();
        ctx.translate(fanCX, fanCY);
        ctx.rotate(tick * 0.18);
        ctx.translate(-fanCX, -fanCY);
        ctx.drawImage(bladeImg, fanX, fanY, fanW, fanW);
        ctx.restore();
      }

      // ── White divider line ──
      const divX = LOGO_BX + 90 * sc;
      const divY = LOGO_BY + 16 * sc;
      const divH = 94 * sc;
      ctx.fillStyle = 'white';
      ctx.fillRect(divX, divY, 2, divH);

      // ── "LES" / "NRG" text in Peddana (falls back to serif) ──
      const fontSize = Math.round(56 * sc);
      ctx.font = `bold ${fontSize}px Peddana, Georgia, serif`;
      ctx.fillStyle = 'white';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const textX = LOGO_BX + 100 * sc;
      ctx.fillText('LES', textX, LOGO_BY + 56 * sc);
      ctx.fillText('NRG', textX, LOGO_BY + 100 * sc);

      ctx.restore();
    }

    // ─── Build static background once, then blit it each frame ───────────────
    function buildBG() {
      const realCtx = ctx;
      ctx = bgCtx;
      drawLevel();
      ctx = realCtx;
      bgBuilt = true;

    function draw() {
      if (!bgBuilt) buildBG();
      ctx.save();

      ctx.drawImage(bgCanvas, 0, 0);
      ctx.restore();
      drawCalderMobile();
      drawAirLeakSources();
      drawLogo();
      for (let i = 0; i < platforms.length; i++) drawPlatform(platforms[i], i);

      drawBullets();

    // ─── Score entry screen ─────────────────────────────────────────────────────
    function updateScoreEntry() {
      scoreEntry.blinkTimer++;
      const gp = navigator.getGamepads ? navigator.getGamepads() : [];
      let pad = null;
      for (let i = 0; i < gp.length; i++) { if (gp[i]) { pad = gp[i]; break; } }

      const dUp    = keys['ArrowUp']   || (pad && ((pad.axes[1] < -0.5) || (pad.buttons[12] && pad.buttons[12].pressed)));
      const dDown  = keys['ArrowDown'] || (pad && ((pad.axes[1] >  0.5) || (pad.buttons[13] && pad.buttons[13].pressed)));
      const dRight = keys['ArrowRight']|| (pad && ((pad.axes[0] >  0.5) || (pad.buttons[15] && pad.buttons[15].pressed)));
      const dLeft  = keys['ArrowLeft'] || (pad && ((pad.axes[0] < -0.5) || (pad.buttons[14] && pad.buttons[14].pressed)));
      const confirm = keys['_gpFire'] || (pad && pad.buttons[0] && pad.buttons[0].pressed);
      const selectBtn = keys['_gpSelect'] || false;

      const upEdge    = dUp    && !scoreEntry.lastDpadUp;
      const downEdge  = dDown  && !scoreEntry.lastDpadDown;
      const rightEdge = dRight && !scoreEntry.lastDpadRight;
      const leftEdge  = dLeft  && !scoreEntry.lastDpadLeft;
      const confirmEdge = confirm && !scoreEntry.lastConfirm;
      const selectEdge = selectBtn && !scoreEntry.lastSelect;
      scoreEntry.lastDpadUp    = dUp;
      scoreEntry.lastDpadDown  = dDown;
      scoreEntry.lastDpadRight = dRight;
      scoreEntry.lastDpadLeft  = dLeft;
      scoreEntry.lastConfirm   = confirm;
      scoreEntry.lastSelect    = selectBtn;

      // Start + Select = skip score entry
      if (keys['_gpStart'] && keys['_gpSelect']) { startDemo(); return; }

      if (scoreEntry.phase === 'initials') {
        if (upEdge) scoreEntry.initials[scoreEntry.cursor] = (scoreEntry.initials[scoreEntry.cursor] + 1) % 26;
        if (downEdge) scoreEntry.initials[scoreEntry.cursor] = (scoreEntry.initials[scoreEntry.cursor] + 25) % 26;
        if (rightEdge && scoreEntry.cursor < 2) scoreEntry.cursor++;
        if (leftEdge && scoreEntry.cursor > 0) scoreEntry.cursor--;
        if (confirmEdge) {
          if (scoreEntry.cursor < 2) scoreEntry.cursor++;
          else { scoreEntry.phase = 'company'; scoreEntry.cursor = 0; scoreEntry.company = [26]; }
        }
      } else if (scoreEntry.phase === 'company') {
        if (selectEdge) { scoreEntry.phase = 'initials'; scoreEntry.cursor = 2; }
        else if (upEdge) scoreEntry.company[scoreEntry.cursor] = (scoreEntry.company[scoreEntry.cursor] + 1) % ALPHABET.length;
        else if (downEdge) scoreEntry.company[scoreEntry.cursor] = (scoreEntry.company[scoreEntry.cursor] + ALPHABET.length - 1) % ALPHABET.length;
        if (rightEdge && scoreEntry.cursor < MAX_COMPANY - 1) {
          scoreEntry.cursor++;
          if (scoreEntry.cursor >= scoreEntry.company.length) scoreEntry.company.push(26);
        }
        if (leftEdge && scoreEntry.cursor > 0) scoreEntry.cursor--;
        if (confirmEdge) scoreEntry.phase = 'email';
      } else if (scoreEntry.phase === 'email') {
        if (selectEdge) { scoreEntry.phase = 'company'; scoreEntry.cursor = 0; }
        else if (confirmEdge) scoreEntry.phase = 'done';
      } else if (scoreEntry.phase === 'done') {
        if (selectEdge) scoreEntry.phase = 'email';
        else if (confirmEdge) submitScore();
      }
    }

    function handleScoreEntryKeyboard(e) {
      if (gameState !== 'scoreEntry') return;
      if (scoreEntry.phase === 'initials') {
        const ch = e.key.toUpperCase();
        if (ch.length === 1 && ch >= 'A' && ch <= 'Z') {
          scoreEntry.initials[scoreEntry.cursor] = ch.charCodeAt(0) - 65;
          if (scoreEntry.cursor < 2) scoreEntry.cursor++;
          else { scoreEntry.phase = 'company'; scoreEntry.cursor = 0; scoreEntry.company = [26]; scoreEntry.kbBuffer = ''; }
        }
        if (e.code === 'Backspace' && scoreEntry.cursor > 0) scoreEntry.cursor--;
      } else if (scoreEntry.phase === 'company') {
        if (e.code === 'Escape') { scoreEntry.phase = 'initials'; scoreEntry.cursor = 2; return; }
        const ch = e.key.toUpperCase();
        if (ch.length === 1 && ((ch >= 'A' && ch <= 'Z') || ch === ' ')) {
          const idx = ALPHABET.indexOf(ch);
          if (idx >= 0) {
            scoreEntry.company[scoreEntry.cursor] = idx;
            if (scoreEntry.cursor < MAX_COMPANY - 1) {
              scoreEntry.cursor++;
              if (scoreEntry.cursor >= scoreEntry.company.length) scoreEntry.company.push(26);
            }
          }
        }
        if (e.code === 'Backspace' && scoreEntry.cursor > 0) {
          scoreEntry.company.splice(scoreEntry.cursor, 1);
          scoreEntry.cursor--;
        }
        if (e.code === 'Enter') scoreEntry.phase = 'email';
      } else if (scoreEntry.phase === 'email') {
        if (e.code === 'Escape') { scoreEntry.phase = 'company'; scoreEntry.cursor = 0; return; }
        if (e.key.length === 1) scoreEntry.email += e.key;
        if (e.code === 'Backspace') scoreEntry.email = scoreEntry.email.slice(0, -1);
        if (e.code === 'Enter') scoreEntry.phase = 'done';
      } else if (scoreEntry.phase === 'done') {
        if (e.code === 'Escape') { scoreEntry.phase = 'email'; return; }
        if (e.code === 'Enter' || e.code === 'Space') submitScore();
      }
    }

    function submitScore() {
      if (scoreEntry.submitted) return;
      scoreEntry.submitted = true;
      keys['Enter'] = false; keys['Space'] = false;  // don't carry the submit press into the leaderboard
      const initials = scoreEntry.initials.map(i => String.fromCharCode(65 + i)).join('');
      const company = scoreEntry.company.map(i => ALPHABET[i]).join('').trim() || 'N/A';
      const email = scoreEntry.email.trim();
      lastSubmittedEntry = { initials, company, score: cfm };
      saveScore(initials, company, cfm, email);
      submitToFormspree(initials, company, cfm, email);
      gameState = 'leaderboard';
      leaderboardTimer = 600;
      requestAnimationFrame(loop);
    }

    // ─── Leaderboard screen ─────────────────────────────────────────────────────

    function drawLeaderboardLogo(cx, cy, scale) {
      const sc = scale;
      const fanW = 80 * sc;
      const fanX = cx - (270 * sc) / 2;
      const fanY = cy - (140 * sc) / 2 + 20 * sc;
      const fanCX = fanX + fanW / 2;
      const fanCY = fanY + fanW / 2;
      const baseY = cy - (140 * sc) / 2;

      ctx.save();
      ctx.fillStyle = '#F5C500';
      ctx.beginPath();
      ctx.roundRect(fanX, fanY, fanW, fanW, 9 / 82.977 * fanW);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(fanCX, fanCY, 31.72 / 82.977 * fanW, 0, TAU);
      ctx.fill();

      const bladeImg = bladesCanvas || imgBlades;
      if (bladeImg.width > 0) {
        ctx.save();
        ctx.translate(fanCX, fanCY);
        ctx.rotate(tick * 0.18);
        ctx.translate(-fanCX, -fanCY);
        ctx.drawImage(bladeImg, fanX, fanY, fanW, fanW);
        ctx.restore();
      }

      const divX = fanX + 90 * sc;
      const divY = baseY + 16 * sc;
      ctx.fillStyle = 'white';
      ctx.fillRect(divX, divY, 2, 94 * sc);

      const fontSize = Math.round(56 * sc);
      ctx.font = `bold ${fontSize}px Peddana, Georgia, serif`;
      ctx.fillStyle = 'white';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const textX = fanX + 100 * sc;
      ctx.fillText('LES', textX, baseY + 56 * sc);
      ctx.fillText('NRG', textX, baseY + 100 * sc);
      ctx.restore();
    }

    function drawLeaderboardScreen() {
      ctx.fillStyle = '#060e0a';
      ctx.fillRect(0, 0, CW, CH);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      drawLeaderboardLogo(CW / 2, 55, 0.6);

      ctx.font = 'bold 38px monospace';
      ctx.fillStyle = '#F5C500';
      ctx.fillText('TOP 20', CW / 2, 115);

      ctx.font = 'bold 16px monospace';
      ctx.fillStyle = '#00e87a88';
      ctx.textAlign = 'left';
      ctx.fillText('RANK', 140, 155);
      ctx.fillText('WHO', 240, 155);
      ctx.fillText('COMPANY', 380, 155);
      ctx.textAlign = 'right';
      ctx.fillText('CFM@50pa', 660, 155);

      ctx.strokeStyle = '#1a3a28';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(120, 173);
      ctx.lineTo(680, 173);
      ctx.stroke();

      const scores = loadScores();
      const rowH = 38;
      const startY = 193;

      for (let i = 0; i < 20; i++) {
        const y = startY + i * rowH;
        const entry = scores[i];

        const isCurrent = entry && lastSubmittedEntry &&
          entry.initials === lastSubmittedEntry.initials &&
          entry.score === lastSubmittedEntry.score;

        if (isCurrent) {
          ctx.fillStyle = 'rgba(0,232,122,0.08)';
          ctx.beginPath();
          ctx.roundRect(120, y - 16, 560, rowH - 4, 4);
          ctx.fill();
          ctx.strokeStyle = '#00e87a44';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(120, y - 16, 560, rowH - 4, 4);
          ctx.stroke();
        }

        ctx.textAlign = 'left';
        ctx.font = 'bold 22px monospace';

        if (!entry) {
          ctx.fillStyle = '#ffffff15';
          ctx.fillText(`${i + 1}.`, 140, y + 4);
          ctx.fillText('---', 240, y + 4);
          continue;
        }

        ctx.fillStyle = isCurrent ? '#00e87a' : (i < 3 ? '#F5C500' : '#ffffff88');
        ctx.fillText(`${i + 1}.`, 140, y + 4);

        ctx.fillStyle = isCurrent ? '#00e87a' : '#ffffffcc';
        ctx.fillText(entry.initials, 240, y + 4);

        ctx.font = '18px monospace';
        ctx.fillStyle = isCurrent ? '#00e87a99' : '#ffffff66';
        ctx.fillText(entry.company, 380, y + 4);

        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'right';
        ctx.fillStyle = isCurrent ? '#00e87a' : '#F5C500';
        ctx.fillText(entry.score.toLocaleString(), 660, y + 4);
      }

      lbBlink++;
      if (lbBlink % 60 < 40) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = '#F5C500';
        ctx.fillText(IS_KIOSK ? 'PRESS START TO CONTINUE' : 'PRESS ENTER TO CONTINUE', CW / 2, CH - 60);
      }

      ctx.restore();
    }

    // ─── Loop ─────────────────────────────────────────────────────────────────
    // Full arcade flow (attract → play → score entry → leaderboard) runs even
    // inside the site iframe; only the on-page control hints get hidden there.
    const inFrame = window !== window.parent;
    const isEmbedded = false;
    if (inFrame) {
      const mc = document.getElementById('mobile-controls');
      if (mc) mc.style.display = 'none';
      const ctrl = document.getElementById('controls');
      if (ctrl) ctrl.style.display = 'none';
    }

let startPrev = false;
    let attractTimer = 0;
    let attractShowLeaderboard = false;

    let renderFrame = 0;
    function loop() {
      pollGamepad();
      checkExitCombo();
      const startCur = keys['_gpStart'] || false;
      const startEdge = startCur && !startPrev;
      startPrev = startCur;
      const shouldDraw = (renderFrame++ & 1) === 0;

      if (gameState === 'attract') {
        attractTimer++;
        // Every 15 seconds, toggle between demo and leaderboard
        if (attractTimer >= 900) {
          attractTimer = 0;
          attractShowLeaderboard = !attractShowLeaderboard;
        }
        if (attractShowLeaderboard) {
          elScoreBar.style.display = 'none';
          if (shouldDraw) drawLeaderboardScreen();
        } else {
          elScoreBar.style.display = 'flex';
          updateAI();
          update();
          updateScoreBar();
          if (shouldDraw) { draw(); drawAttractOverlay(); }
          if (gameOver || gameWon) { startDemo(); return; }
        }
        if (startEdge || keys['Space'] || keys['Enter']) {
          keys['Space'] = false; keys['Enter'] = false; keys['_gpStart'] = false;
          startGame(); return;
        }
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === 'playing') {
        update();
        updateScoreBar();
        if (shouldDraw) draw();
        if (gameOver || gameWon) {
          if (isEmbedded) {
            if (gameOver) {
              const sub = loseReason === 'fan' ? 'Sucked into the fan!' : 'The leaks got you.';
              drawOverlay('GAME OVER', `${cfm} CFM50  —  ${sub}`, '[ PRESS R TO RESTART ]');
            } else {
              drawOverlay('GAME OVER', `${cfm} CFM50`, '[ PRESS R TO PLAY AGAIN ]');
            }
          } else {
            gameState = 'gameover';
            gameoverTimer = GAMEOVER_DURATION;
          }
          requestAnimationFrame(loop);
          return;
        }
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === 'gameover') {
        gameoverTimer--;
        if (shouldDraw) {
          draw();
          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.fillRect(0, 0, CW, CH);
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const flash = Math.floor(gameoverTimer / 8) % 2 === 0;
          if (flash) {
            ctx.font = 'bold 52px monospace';
            ctx.fillStyle = '#F5C500';
            ctx.fillText('GAME OVER', CW / 2, CH / 2 - 40);
            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#00e87a';
            ctx.fillText('YOU DID IT!', CW / 2, CH / 2 + 15);
            ctx.font = '22px monospace';
            ctx.fillStyle = '#ffffffbb';
            ctx.fillText(`${cfm} CFM@50pa`, CW / 2, CH / 2 + 55);
          }
          ctx.restore();
        }
        if (gameoverTimer <= 0) {
          gameState = 'scoreEntry';
          resetScoreEntry();
          elScoreBar.style.display = 'none';
        }
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === 'scoreEntry') {
        scoreScreenTimer++;
        if (scoreScreenTimer >= SCORE_SCREEN_TIMEOUT) { startDemo(); return; }
        updateScoreEntry();
        if (shouldDraw) drawScoreEntryScreen();
        requestAnimationFrame(loop);
        return;
      }

      if (gameState === 'leaderboard') {
        leaderboardTimer--;
        if (shouldDraw) drawLeaderboardScreen();
        const kbContinue = leaderboardTimer < 570 && (keys['Enter'] || keys['Space']);
        if (leaderboardTimer <= 0 || startEdge || kbContinue) { startDemo(); return; }
        requestAnimationFrame(loop);
        return;
      }
    }

    window.addEventListener('keydown', e => {
      if (gameState === 'scoreEntry') { handleScoreEntryKeyboard(e); return; }
      if (isEmbedded && e.code === 'KeyR' && (gameOver || gameWon)) startGame();
    });

    // ─── Parent-frame key injection (for embedded mobile controls) ───────────
    window.addEventListener('message', e => {
      if (e.data?.type === 'KEY_DOWN' && e.data.key) keys[e.data.key] = true;
      if (e.data?.type === 'KEY_UP'   && e.data.key) keys[e.data.key] = false;
      if (e.data?.type === 'JUMP') {
        if (player.jumpsLeft > 0) {
          player.vy = player.jumpsLeft === 1 ? DOUBLE_JUMP_FORCE : JUMP_FORCE;
          player.onGround = false;
          player.jumpsLeft--;
        }
      }
      if (e.data?.type === 'SHOOT') {
        if (fireCooldown === 0 && gameState === 'playing') { spawnBullet(); sfxShoot(); }
      }
      if (e.data?.type === 'RESTART' && isEmbedded && (gameOver || gameWon)) {
        startGame();
      }
    });

    // Touch handling for all screens
    canvas.addEventListener('touchstart', e => {
      if (gameState === 'attract') { e.preventDefault(); startGame(); }
      else if (gameState === 'scoreEntry' && scoreEntry.phase === 'done') { e.preventDefault(); submitScore(); }
      else if (gameState === 'leaderboard') { e.preventDefault(); startDemo(); }
      else if (isEmbedded && (gameOver || gameWon)) { e.preventDefault(); startGame(); }
    }, { passive: false });

    startDemo();
  </script>

</body>
